name: Daily Auto Commit
on:
  schedule:
    - cron: '0 6 * * *'   # ei line tai cron job
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Update: $(date)" >> log.txt
          git config user.name "dipto0079"
          git config user.email "sudiptobiswas423@gmail.com"
          git add log.txt
          git commit -m "Daily update $(date +'%Y-%m-%d')"
          git push
